name: Backend CI

# Finding M6: automated build + test gate on every push / PR so regressions (including the
# payment and auth fixes) cannot merge unverified.
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test and verify
        # Uses a throwaway secret so the C2 boot-check passes in CI; real secrets come from the
        # environment in deployment, never from source control.
        env:
          JWT_SECRET: ci-only-non-secret-value-at-least-32-bytes-long-1234
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B --no-transfer-progress verify

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OVH VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/innerstyle/InnerStyle-Backend/InnerStyle-Backend
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build backend
            docker image prune -f
