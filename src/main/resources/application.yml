server:
  port: ${PORT:8085}

spring:
  application:
    name: innerstyle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/innerstyle}
    username: ${DATABASE_USERNAME:innerstyle}
    password: ${DATABASE_PASSWORD:innerstyle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        # env-driven (finding m5): TLS is pointless against a local plaintext Redis in dev and
        # breaks the connection; enable it (REDIS_SSL_ENABLED=true) for managed/prod Redis.
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 60MB # 3D model uploads (.glb/.fbx/...) can be tens of MB
      max-request-size: 80MB # also allow several images for multi-image-to-3D upload

# Application-specific configuration (bound to @ConfigurationProperties)
app:
  # CORS allow-list (origin patterns). Finding M2: the committed default is now a tight allow-list
  # of known origins only. Because allowCredentials(true) is set, broad wildcards
  # (http://localhost:*, https://*.vercel.app, *.ngrok.*) are an over-wide trust boundary and were
  # removed from the default. Add extra origins (ngrok tunnels, Vercel previews) explicitly via
  # APP_CORS_ALLOWED_ORIGIN_PATTERNS per environment; keep production on the real frontend origin.
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,https://www.innerstyle.online}
  meshy:
    api-key: ${MESHY_API_KEY:}
    base-url: ${MESHY_BASE_URL:https://api.meshy.ai}
    webhook-secret: ${MESHY_WEBHOOK_SECRET:}
    connect-timeout: 10s
    read-timeout: 60s
    # Polling fallback that reconciles task status (webhook is the primary path)
    poll:
      enabled: true
      interval-ms: 15000
      batch-size: 25

  # --- Auth / JWT ---
  jwt:
    # HMAC-SHA256 secret (>= 32 bytes). MUST be overridden via env in production.
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    issuer: innerstyle
    access-ttl: ${JWT_ACCESS_TTL:PT15M} # 15 minutes
    refresh-ttl: ${JWT_REFRESH_TTL:P7D} # 7 days
  auth:
    # Base URL of the frontend, used to build the Google sign-in redirect target.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  oauth:
    google:
      # Expected audience (your Google OAuth client id). Leave blank to skip aud check (dev only).
      client-id: ${GOOGLE_CLIENT_ID:}
      # Confidential secret for the server-side authorization-code exchange (Google Cloud Console
      # → Credentials → your OAuth client). Required for /oauth/google/authorize+callback.
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Must exactly match a redirect URI registered on that OAuth client.
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:2207/api/user/auth/oauth/google/callback}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      # Required alongside app-id to verify a Facebook token's audience via /debug_token.
      # Leave both blank to skip the check (dev only).
      app-secret: ${FACEBOOK_APP_SECRET:}

  # --- 3D print pricing (paid directly via payOS) ---
  # `fee` is the fallback; `prices` is the sell price (VND) per figurine height in cm.
  print:
    fee: ${PRINT_FEE:300000}
    prices:
      8: 649000
      12: 749000
      15: 849000

  # --- Payment gateways (direct payment for subscription + print) ---
  payment:
    order-ttl: ${PAYMENT_ORDER_TTL:PT15M}
    payos:
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
      return-url: ${PAYOS_RETURN_URL:http://localhost:5173/wallet/payos-return}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/wallet/payos-return}

  # --- Object storage: Cloudflare R2 (S3-compatible) ---
  # Large binaries (GLB/USDZ models, texture maps, thumbnails) live in the bucket; PostgreSQL keeps
  # only the object key + metadata. Endpoint: https://<account-id>.r2.cloudflarestorage.com
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:https://account-id.r2.cloudflarestorage.com}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:innerstyle-assets}
    # Copy legacy BYTEA blobs (pre-R2 rows) into R2 on startup; idempotent, safe to leave on.
    backfill:
      enabled: ${R2_BACKFILL_ENABLED:true}
      batch-size: 20

  # --- Redis-backed cache + rate limiting (fail-open if Redis is unavailable) ---
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:is:dev}
  cache:
    pricing-ttl: PT1H
    gallery-ttl: PT60S
    user-ttl: PT15M
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-per-minute: 120
    login-per-minute: 5
    register-per-hour: 5
    email-per-10min: 3
    generation-per-minute: 10
    payment-per-minute: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Observability (finding m6): expose health + metrics (and prometheus when a registry is present)
# so payment / Meshy failures and abuse are visible in production.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.innerstyle: INFO
  # Include the per-request correlation id (set by CorrelationIdFilter) in every log line.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
