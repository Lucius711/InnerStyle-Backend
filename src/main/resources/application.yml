server:
  port: ${PORT:8085}

spring:
  application:
    name: innerstyle-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/innerstyle}
    username: ${DATABASE_USERNAME:innerstyle}
    password: ${DATABASE_PASSWORD:innerstyle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
  # SMTP (Gmail) for transactional emails. Leave MAIL_USERNAME blank in local dev to fall
  # back to the LoggingEmailSender (OTP printed to the log). In production set:
  #   MAIL_USERNAME      = your.account@gmail.com
  #   MAIL_PASSWORD      = a 16-char Gmail App Password (NOT the account password)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 60MB # 3D model uploads (.glb/.fbx/...) can be tens of MB
      max-request-size: 80MB # also allow several images for multi-image-to-3D upload

# Application-specific configuration (bound to @ConfigurationProperties)
app:
  # CORS allow-list (origin patterns, wildcards allowed). Comma-separated when set via env.
  # Defaults cover the Vite dev server (localhost:5173), any localhost/127.0.0.1 port,
  # and ngrok tunnels — so the in-browser 3D viewer can load Meshy textures cross-origin.
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:5173,http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.app,https://*.ngrok.io,https://*.ngrok.app}
  # Resend transactional email over HTTPS (port 443). Set RESEND_API_KEY to use it in preference
  # to SMTP — required on cloud hosts that block outbound SMTP (e.g. Railway on non-Pro plans).
  # Leave RESEND_API_KEY blank to fall back to SMTP (spring.mail.*) or the LoggingEmailSender.
  resend:
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    connect-timeout: 5s
    read-timeout: 10s
  meshy:
    api-key: ${MESHY_API_KEY:}
    base-url: ${MESHY_BASE_URL:https://api.meshy.ai}
    webhook-secret: ${MESHY_WEBHOOK_SECRET:}
    connect-timeout: 10s
    read-timeout: 60s
    # Polling fallback that reconciles task status (webhook is the primary path)
    poll:
      enabled: true
      interval-ms: 15000
      batch-size: 25

  # --- Auth / JWT ---
  jwt:
    # HMAC-SHA256 secret (>= 32 bytes). MUST be overridden via env in production.
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-secret-at-least-32-bytes}
    issuer: innerstyle
    access-ttl: ${JWT_ACCESS_TTL:PT15M} # 15 minutes
    refresh-ttl: ${JWT_REFRESH_TTL:P7D} # 7 days
  auth:
    # Base URL of the frontend, used to build the password-reset link in emails.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    password-reset-ttl: ${PASSWORD_RESET_TTL:PT15M}
    max-failed-logins: 5
    lock-duration: PT15M
    # Email-verification OTP: a numeric code emailed on registration / resend.
    otp-length: ${EMAIL_OTP_LENGTH:6}
    otp-ttl: ${EMAIL_OTP_TTL:PT10M}
    otp-max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
    # Sender identity for outgoing verification emails.
    mail-from: ${MAIL_FROM:no-reply@innerstyle.app}
    mail-from-name: ${MAIL_FROM_NAME:InnerStyle}
  oauth:
    google:
      # Expected audience (your Google OAuth client id). Leave blank to skip aud check (dev only).
      client-id: ${GOOGLE_CLIENT_ID:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}

  # --- 3D print pricing (paid directly via VNPay/MoMo) ---
  # `fee` is the fallback; `prices` is the sell price (VND) per figurine height in cm.
  print:
    fee: ${PRINT_FEE:300000}
    prices:
      8: 649000
      12: 749000
      15: 849000

  # --- Payment gateways (direct payment for subscription + print) ---
  payment:
    order-ttl: ${PAYMENT_ORDER_TTL:PT15M}
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:5173/wallet/vnpay-return}
    momo:
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173/wallet/momo-return}
      ipn-url: ${MOMO_IPN_URL:http://localhost:2207/api/common/payments/momo/ipn}

  # --- Redis-backed cache + rate limiting (fail-open if Redis is unavailable) ---
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:is:dev}
  cache:
    pricing-ttl: PT1H
    gallery-ttl: PT60S
    user-ttl: PT15M
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-per-minute: 120
    login-per-minute: 5
    register-per-hour: 5
    email-per-10min: 3
    generation-per-minute: 10
    payment-per-minute: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.innerstyle: INFO
